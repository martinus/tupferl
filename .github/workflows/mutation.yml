name: mutation sweep

# Separate from `ci.yml`, and deliberately not a required check.
#
# Plan §7.5 asks for the full sweep on a schedule, "not per PR -- it takes hours
# by design". The per-PR half of that rule lives with the author instead of here:
# CLAUDE.md requires `python -m tools.mutate --base main` before the pull request
# opens, with the output pasted in verbatim. A CI job repeating that would be a
# second, slower copy of a number the PR already carries, and one nobody can act
# on without the tree in front of them.
#
# So this exists for the sweep no human runs by hand: everything, weekly, against
# whatever `main` has become.

on:
  schedule:
    # Sunday 03:17 UTC. Not on the hour: GitHub queues scheduled workflows and
    # the busy minutes are the round ones.
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      base:
        description: "sweep only what changed against this ref (empty = everything)"
        required: false
        default: ""

jobs:
  sweep:
    runs-on: ubuntu-latest
    # Hours by design, and the ceiling is here so a wedged run is reported
    # rather than silently holding a runner until GitHub's own limit.
    #
    # **Measured, not guessed: the whole tree takes almost exactly five hours.**
    # 2999 rows in ~300 minutes at seven lanes on a 4-core, 16 GiB machine --
    # the same shape as this runner. At 300 the job was a coin flip decided by
    # how loaded the runner happened to be, and losing it was quiet: a killed
    # run still uploads a report, because `--all` implies `--batch` and
    # `_persist` writes after every file.
    #
    # 420 rather than 360, because the rate is not uniform and the tail is the
    # expensive part. `sweep` runs the smallest file first (tupferl#49), so the
    # last file is the largest -- `tools/mutate.py`, 738 rows, whose selection
    # is the slowest module in the suite and whose rows survive most often, and
    # a survivor only earns the name after the whole walk. Measured: 2.15 s/row
    # cumulative at 20 minutes, 5.4 s/row by the end, 12 s/row marginal through
    # that tail. A budget set from the early rate would be 1.8 hours, and wrong
    # by nearly three times.
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
        with:
          # `--base` needs history to diff against, and the default checkout is
          # a single commit.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[test]
      - name: sweep
        run: |
          if [ -n "${{ inputs.base }}" ]; then
            echo "scope: changed against ${{ inputs.base }}" | tee scope.txt
            python -m tools.mutate --base "${{ inputs.base }}" --json results.json
          else
            echo "scope: every mutable line under tupferl/ and tools/" | tee scope.txt
            python -m tools.mutate --all --json results.json
          fi
      - name: what survived, and why
        # `if: always()`: the sweep exits non-zero when anything survived, which
        # is the case the report is most worth keeping.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-results
          # `scope.txt` beside the report, because the report cannot say what it
          # was asked for. A `results.json` covering only the 41% of rows that
          # are `tupferl/` is indistinguishable from one covering the tree, and
          # a run killed part-way writes a report that reads exactly like a
          # complete one -- CLAUDE.md section 8's "green you cannot explain",
          # with the count looking right either way.
          path: |
            results.json
            scope.txt
          if-no-files-found: warn
