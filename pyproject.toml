[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tupferl"
# Read from tupferl/__init__.py rather than repeated here. Two declarations can
# disagree, and when they do `tupferl --version` lies about what is installed --
# which matters most during a release, when it is the only thing anyone checks.
dynamic = ["version"]
description = "A simple dotfiles manager: one git repository, one sync command"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Martin Leitner-Ankerl", email = "martin.ankerl@gmail.com" }]
keywords = ["dotfiles", "git", "sync", "config"]

# No `License ::` classifier: `license = "Apache-2.0"` above is the SPDX
# expression PEP 639 replaced it with, and declaring both is how a build starts
# failing on a future packaging release.
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

# One conditional dependency and no others. `tomllib` entered the standard
# library in 3.11 and this project supports 3.10 (plan §5), so 3.10 needs the
# backport `tomllib` was taken from -- same parser, same API. Dropping 3.10 is
# the way to remove this line; nothing else here needs it.
#
# `rich` is sanctioned by plan §5 for the conflict UI. It is not listed yet
# because nothing imports it yet, and a declared dependency nobody uses is a
# dependency nobody notices going stale.
#
# The other half of that sanction -- coloured diffs -- was spent without it:
# `status --diff` hands a plain unified diff to the pager git is configured
# with, so the colour comes from the user's `delta` and costs no dependency.
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
# Floors, not pins -- but recent ones, and specifically the versions this tree is
# actually formatted and checked by. `ruff format --check` is a *formatter* gate
# whose output changes between versions, so a floor three years behind lets a
# contributor pass locally and fail in CI for no reason they can see.
#
# `test` is separate from `dev` so the CI jobs that only run the suite can take
# hypothesis without also pulling a linter and a type checker into a job that
# runs neither.
#
# `pytest` is here rather than in `dev` because the suite will be run by it
# (docs/pytest-plan.md): a job that only runs tests needs it, and a job that
# only lints does not.
#
# The floor is the version Phase 0 spiked, and here that is stronger than the
# usual floors-are-real-versions stance: the mutation harness classifies pytest
# *report objects*, and their shape for `TestCase.subTest` changed between 8 and
# 9. Measured on the same two-case fixture, second case failing:
#
#     8.4.2   one TestReport,  outcome failed
#     9.1.1   SubtestReport passed, SubtestReport failed, TestReport *passed*
#
# Both fail the run, so this is not about a silent pass -- it is that on 9 the
# owning test's own report says `passed`, and a classifier reading only
# `TestReport` would call a subTest kill "nothing noticed". Written against one
# version it is wrong on the other, so the floor is the version it was written
# against. `pytest-subtests` is deliberately absent: on 9 it changes the report
# stream for `TestCase.subTest` not at all, only the summary wording.
test = ["hypothesis>=6.100", "pytest>=9.1.1"]
dev = ["ruff>=0.16", "mypy>=2.3", "tupferl[test]"]

[project.scripts]
tupferl = "tupferl.__main__:main"

# Below every plain key of `[project]`, not beside `classifiers` where it reads
# better: a TOML sub-table ends its parent, so `[project.urls]` up there quietly
# swallows `dependencies` and the rest into itself. The build fails with "URL
# `dependencies` must be a string", which does not sound like a misplaced
# heading.
[project.urls]
Homepage = "https://github.com/martinus/tupferl"
Source = "https://github.com/martinus/tupferl"
Issues = "https://github.com/martinus/tupferl/issues"

[tool.hatch.version]
path = "tupferl/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["tupferl"]

[tool.hatch.build.targets.sdist]
include = ["tupferl", "tests", "tools", "docs", "README.md", "LICENSE", "CLAUDE.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Mutation specs are throwaway tables of source text, and the source they quote
# is not theirs to reformat -- a wrapped `old` string no longer matches the file,
# so the row silently applies to nothing.
extend-exclude = ["*.md", "spec_*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true

# Hypothesis is a third-party import with two frictions against `strict`. Both
# are narrowed to the modules that use it rather than relaxed for the tree: an
# exemption wide enough to cover a file nobody remembers writing is the kind that
# stops being noticed.
[[tool.mypy.overrides]]
module = ["hypothesis.*", "tomli.*"]
ignore_missing_imports = true

# `@rule` and `@invariant` are generic wrappers mypy reads as untyped, so
# `disallow_untyped_decorators` rejects every rule in a state machine, and
# `RuleBasedStateMachine` reads as `Any` once its module is unresolved above, so
# subclassing it trips `disallow_subclassing_any`. The alternative is a
# `type: ignore` per rule, which is the same exemption written five times where a
# reader will stop seeing it.
#
# Listed rather than matched: mypy only accepts `*` as a whole component, so
# `tests.test_*_properties` is rejected outright. Every `_properties` module
# belongs here -- the suffix is the convention that earns them, and the list is
# what mypy will take.
[[tool.mypy.overrides]]
module = [
    "tests.profiles",
    "tests.test_config_properties",
    "tests.test_merge_properties",
    "tests.test_sync_properties",
]
disallow_untyped_decorators = false
disallow_subclassing_any = false

# Everything the mutation harness in `tools/` knows about *this* project, and the
# only place any of it is written down. `tools/settings.py` reads it and holds
# generic defaults, so the harness carries no project name of its own -- which is
# what makes extracting it a packaging exercise rather than a rewrite
# (docs/pytest-plan.md, Phase D).
#
# Every key is stated, including the two whose value equals the default, because
# this table is also the documentation of what the table takes: a knob that only
# appears in a dataclass is a knob nobody knows to reach for.
[tool.mutate]
# Never `tests/`: breaking a test proves nothing about the fix, and the run would
# report the assertion it removed.
mutable = ["tupferl/", "tools/"]
# Empty here. It exists because in the project this harness came from, a script
# under `tools/` built a sandbox and then wrote a real store into it, so a mutant
# that broke the one line pointing it at that sandbox wrote into the developer's
# live installation (woswoar#245).
unmutable = []
# `TUPFERL_MUTATE_BUDGET`, `_TOTAL`, `_EACH_TEST`, `_MUTATED`. `tests/support.py`
# derives the same names from the same key, so renaming this renames both halves.
env_prefix = "TUPFERL"
tmp_prefix = "tupferl-"
# The variable `tests/profiles.py` reads, and a profile it registers. Not derived
# from `env_prefix`, because this names a variable the *suite* owns.
hypothesis_profile_env = "TUPFERL_HYPOTHESIS_PROFILE"
hypothesis_profile = "mutation"
# Off, and measured: it takes 79.5 ms off every probe and makes a sweep
# reproducible across machines whatever anyone has installed. Nothing in this
# suite needs an autoloaded plugin -- Hypothesis is driven through its API here,
# not through its pytest integration -- so the list below is empty.
probe_autoload = false
probe_plugins = []
# What `--accept` wraps a `# survivor:` tag to. It has to be `[tool.ruff]
# line-length` below, and `tests/test_packaging.py` asserts that -- a tag wrapped
# to the wrong width turns the preflight red on generated text nobody would think
# to attribute. Stated twice because they are two different tools' settings that
# happen to need the same number; the test is what keeps them equal.
tag_columns = 100
# On top of the universal list in `tools/mutate.py`'s `_SKIP`. `sweeps` is this
# repository's mutation reports, 3.5 MB and growing that no mutant reads;
# `.venv` is a spelling and another project's is `venv/` or `.tox/`. A sandbox is
# copied once per lane per row, so this is where a sweep's largest avoidable cost
# is decided.
sandbox_ignore = ["sweeps", ".venv"]
tests_dir = "tests"
test_module_patterns = ["test_{stem}", "test_{stem}_*"]
